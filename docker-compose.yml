# Dalal: one command to bring everything up:  docker compose up -d --build
# Only the web UI is published, and only on BIND_ADDR (127.0.0.1 or your Tailscale IP).
# The API, database and Redis are reachable only inside this compose network.
name: dalal

x-backend: &backend
  build: ./backend
  image: dalal-backend:local
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    IMPORTS_DIR: /imports
    DATA_DIR: /data
    TZ: Asia/Kolkata
  volumes:
    - ./imports:/imports:ro
    - ./data:/data
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dalal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dalal}
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dalal} -d ${POSTGRES_DB:-dalal}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "300", "10"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend
    command: ["sh", "-c", "python -m app.cli migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  scheduler:
    <<: *backend
    command: ["python", "-m", "app.jobs.scheduler"]
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    image: dalal-web:local
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
