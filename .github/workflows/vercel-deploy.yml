# Deploys Dalal to Vercel's free tier (see DEPLOY_VERCEL.md). One secret needed:
# VERCEL_TOKEN (vercel.com → Account Settings → Tokens). Without it this run only
# explains what to do and stays green.
name: Deploy to Vercel

on:
  push:
    branches: [main, claude/new-session-kfi3aq]
    paths:
      - backend/**
      - frontend/**
      - .github/scripts/**
      - .github/workflows/vercel-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # The Vercel team that owns the projects (from Vercel's GitHub bot); override with a repo variable.
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'sparkyaipvtltd-9543s-projects' }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID || 'team_CvSRUYihh0vnYPxGg7jArw9O' }}
      # The two Vercel projects already connected to this repo; override with repo variables.
      DALAL_API_PROJECT: ${{ vars.DALAL_API_PROJECT || 'dalal-streetpredictor' }}
      DALAL_WEB_PROJECT: ${{ vars.DALAL_WEB_PROJECT || 'dalal-street-predictor' }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check for VERCEL_TOKEN
        id: gate
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::notice::VERCEL_TOKEN isn't set, so nothing was deployed. See the run summary."
          {
            echo "## One step left"
            echo
            echo "1. Create a token at **vercel.com → Account Settings → Tokens** with **Scope: Full Account**"
            echo "   (not a team or a single project: the Vercel CLI must be able to read your user)."
            echo "2. In this repo: **Settings → Secrets and variables → Actions → New repository secret**,"
            echo "   name \`VERCEL_TOKEN\`, paste the token."
            echo "3. Re-run this workflow. It creates everything and prints your link here."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      # Fails in seconds, with the fix in the summary, if the token's scope is too narrow.
      - name: Check the token
        if: steps.gate.outputs.ready == 'true'
        run: python3 .github/scripts/vercel_token_check.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Install
        if: steps.gate.outputs.ready == 'true'
        run: |
          pip install ./backend
          npm install -g --no-audit --no-fund vercel@64.5.0

      - name: Deploy
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        run: bash .github/scripts/vercel-deploy.sh
