# Dalal's scheduled jobs for the Vercel deployment (SCHEDULER_MODE=external).
# Docker Compose users don't need this: the scheduler container runs the same jobs.
#
# Off until you set the repository variable DALAL_JOBS_ENABLED=true (see DEPLOY_VERCEL.md),
# so the schedule doesn't fail every 30 minutes before the secrets exist.
#
# Times are UTC; IST = UTC+5:30. GitHub can start scheduled runs several minutes late.
name: Dalal jobs

on:
  schedule:
    - cron: "35 0 * * *"       # 06:05 IST daily      holiday_refresh
    - cron: "30 1 * * 1-5"     # 07:00 IST Mon-Fri    kite_login_reminder
    - cron: "15 3 * * 1-5"     # 08:45 IST Mon-Fri    instrument_sync
    - cron: "0 14 * * 1-5"     # 19:30 IST Mon-Fri    evening_data_pull
    - cron: "*/30 0-17 * * *"  # 05:30-23:30 IST      global_cues_refresh
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        default: migrate
        options:
          - migrate
          - sync-instruments
          - backfill
          - test-telegram
          - run-job holiday_refresh
          - run-job global_cues_refresh
          - run-job kite_login_reminder
          - run-job instrument_sync
          - run-job evening_data_pull

permissions:
  contents: read

concurrency:
  group: dalal-${{ github.event.schedule || inputs.command }}
  cancel-in-progress: false

jobs:
  run:
    if: vars.DALAL_JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
      KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
      KITE_USER_ID: ${{ secrets.KITE_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      WATCHLIST: ${{ vars.WATCHLIST }}
      SCHEDULER_MODE: external
      IMPORTS_DIR: ${{ github.workspace }}/imports
      DATA_DIR: ${{ runner.temp }}
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install .

      - name: Choose command
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.command }}
        run: |
          case "$SCHEDULE" in
            "35 0 * * *")      CMD="run-job holiday_refresh" ;;
            "30 1 * * 1-5")    CMD="run-job kite_login_reminder" ;;
            "15 3 * * 1-5")    CMD="run-job instrument_sync" ;;
            "0 14 * * 1-5")    CMD="run-job evening_data_pull" ;;
            "*/30 0-17 * * *") CMD="run-job global_cues_refresh" ;;
            "")                CMD="$INPUT" ;;
            *) echo "Unknown schedule: $SCHEDULE"; exit 1 ;;
          esac
          if ! [[ "$CMD" =~ ^(migrate|sync-instruments|backfill|test-telegram|run-job\ [a-z_]+)$ ]]; then
            echo "Refusing unexpected command: $CMD"; exit 1
          fi
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      - name: Run
        env:
          CMD: ${{ steps.pick.outputs.cmd }}
        run: python -m app.cli $CMD
