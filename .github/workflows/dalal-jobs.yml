# Dalal's scheduled jobs for the Vercel deployment (SCHEDULER_MODE=external).
# Docker Compose users don't need this: the scheduler container runs the same jobs.
#
# Does nothing (and stays green) until Dalal is deployed: settings are read from the
# Vercel API project via VERCEL_TOKEN, or from GitHub secrets. Set the repository
# variable DALAL_JOBS_ENABLED=false to pause the schedule.
#
# Times are UTC; IST = UTC+5:30. GitHub can start scheduled runs several minutes late.
name: Dalal jobs

on:
  schedule:
    - cron: "35 0 * * *"       # 06:05 IST daily      holiday_refresh
    - cron: "30 1 * * 1-5"     # 07:00 IST Mon-Fri    kite_login_reminder
    - cron: "15 3 * * 1-5"     # 08:45 IST Mon-Fri    instrument_sync
    - cron: "0 14 * * 1-5"     # 19:30 IST Mon-Fri    evening_data_pull
    - cron: "*/30 0-17 * * *"  # 05:30-23:30 IST      global_cues_refresh
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        default: migrate
        options:
          - migrate
          - sync-instruments
          - backfill
          - test-telegram
          - run-job holiday_refresh
          - run-job global_cues_refresh
          - run-job kite_login_reminder
          - run-job instrument_sync
          - run-job evening_data_pull

permissions:
  contents: read

concurrency:
  group: dalal-${{ github.event.schedule || inputs.command }}
  cancel-in-progress: false

jobs:
  run:
    if: vars.DALAL_JOBS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      SCHEDULER_MODE: external
      IMPORTS_DIR: ../imports  # relative to backend/, the working directory
      DATA_DIR: /tmp/dalal-data
      LOG_LEVEL: info
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Settings come from the Vercel API project (VERCEL_TOKEN), or from GitHub secrets.
      - name: Load settings
        id: cfg
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'sparkyaipvtltd-9543s-projects' }}
          DALAL_API_PROJECT: ${{ vars.DALAL_API_PROJECT || 'dalal-streetpredictor' }}
          GH_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_REDIS_URL: ${{ secrets.REDIS_URL }}
          GH_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GH_KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          GH_KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          GH_KITE_USER_ID: ${{ secrets.KITE_USER_ID }}
          GH_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          GH_WATCHLIST: ${{ vars.WATCHLIST }}
        run: bash ../.github/scripts/jobs-env.sh

      - name: Install
        if: steps.cfg.outputs.configured == 'true'
        run: pip install .

      - name: Choose command
        id: pick
        if: steps.cfg.outputs.configured == 'true'
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.command }}
        run: |
          case "$SCHEDULE" in
            "35 0 * * *")      CMD="run-job holiday_refresh" ;;
            "30 1 * * 1-5")    CMD="run-job kite_login_reminder" ;;
            "15 3 * * 1-5")    CMD="run-job instrument_sync" ;;
            "0 14 * * 1-5")    CMD="run-job evening_data_pull" ;;
            "*/30 0-17 * * *") CMD="run-job global_cues_refresh" ;;
            "")                CMD="$INPUT" ;;
            *) echo "Unknown schedule: $SCHEDULE"; exit 1 ;;
          esac
          if ! [[ "$CMD" =~ ^(migrate|sync-instruments|backfill|test-telegram|run-job\ [a-z_]+)$ ]]; then
            echo "Refusing unexpected command: $CMD"; exit 1
          fi
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      - name: Run
        if: steps.cfg.outputs.configured == 'true'
        env:
          CMD: ${{ steps.pick.outputs.cmd }}
        # CMD was checked against an allowlist above; split it into arguments.
        run: |
          read -ra ARGS <<< "$CMD"
          python -m app.cli "${ARGS[@]}"
